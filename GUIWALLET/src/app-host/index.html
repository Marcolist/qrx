<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>QRX App Sandbox</title>
<style>
:root{color-scheme:dark;background:#07101d;color:#eaf6ff;font:14px system-ui,-apple-system,Segoe UI,sans-serif}*{box-sizing:border-box}body{margin:0;display:flex;flex-direction:column;height:100vh;background:#07101d}.bar{display:flex;gap:10px;align-items:center;padding:10px 14px;border-bottom:1px solid #1f3851;background:#0b1727}.pill{padding:4px 8px;border:1px solid #285170;border-radius:999px;color:#90e9ff}.grow{flex:1}.small{font-size:12px;color:#9bb0c5}iframe{width:100%;height:100%;border:0;background:#fff}.error{padding:24px;color:#ffb6b6;white-space:pre-wrap}
</style></head><body>
<div class="bar"><strong id="name">QRX App</strong><span class="pill" id="sandboxLabel">Sandbox · SDK v1</span><span class="small" id="source"></span><span class="grow"></span><span class="small" id="permissions"></span></div>
<div id="error" class="error" hidden></div><iframe id="app" sandbox="allow-scripts" referrerpolicy="no-referrer" allow="camera 'none'; microphone 'none'; geolocation 'none'; payment 'none'; clipboard-read 'none'; clipboard-write 'none'"></iframe>
<script>
const invoke=window.__TAURI__?.tauri?.invoke; const qp=new URLSearchParams(location.search); const appId=qp.get('app')||''; const network=qp.get('network')||'alpha'; const wallet=qp.get('wallet')||'node1'; const frame=document.getElementById('app');
const QRX_HOST_LANGS=['en','de','fr','es','it','pt','nl','pl','cs','sk','sl','hr','hu','ro','bg','el','sv','da','fi','et','lv','lt','ga','mt','is','no','uk','tr','id','th','zh-CN','zh-TW','ja','ar','af','am','sw','so','ti','rw','rn','st','tn','ss','zu','xh','mg','ny','sn','nd','nso','ts','ve','nr','ber'];
let hostCat={},hostEn={}; const norm=x=>{x=String(x||'en');if(QRX_HOST_LANGS.includes(x))return x;const b=x.split('-')[0];return QRX_HOST_LANGS.includes(b)?b:'en'}; const ht=k=>hostCat[k]??hostEn[k]??k;
async function hostI18n(){const l=norm(localStorage.getItem('qrx.language')||navigator.language);document.documentElement.lang=l;document.documentElement.dir=l==='ar'?'rtl':'ltr';try{hostEn=await (await fetch('../locales/en.json',{cache:'no-store'})).json();hostCat=l==='en'?hostEn:await (await fetch(`../locales/${l}.json`,{cache:'no-store'})).json();}catch(_){hostCat=hostEn={};}document.getElementById('sandboxLabel').textContent=ht('qrx.apphost.sandbox');}
const escScript=s=>String(s||'').replace(/<\/script/gi,'<\\/script');
async function boot(){try{await hostI18n();if(!invoke)throw new Error('QRX App Host IPC');const b=await invoke('qrx_app_load_bundle',{appId});document.title=`${b.manifest.name} · QRX`;document.getElementById('name').textContent=b.manifest.name;document.getElementById('source').textContent=`${b.source==='developer'?ht('qrx.apps.source_developer'):'.qrxapp'} · ${b.manifest.version}`;document.getElementById('permissions').textContent=(b.approved_permissions||[]).length?`${ht('qrx.apps.permissions')}: ${(b.approved_permissions||[]).join(', ')}`:ht('qrx.apps.no_permissions');const sdk=await (await fetch('../apps/sdk/qrx-sdk.js',{cache:'no-store'})).text();let html=String(b.html||'');const appCsp=`<meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src data: blob:; media-src data: blob:; font-src data:; style-src 'unsafe-inline'; script-src 'unsafe-inline'; connect-src 'none'; form-action 'none'; base-uri 'none'; object-src 'none'">`;const style=`${appCsp}<style>${String(b.style||'')}</style>`;const scripts=`<script>${escScript(sdk)}<\/script><script>${escScript(b.script||'')}<\/script>`;if(/<\/head>/i.test(html))html=html.replace(/<\/head>/i,style+'</head>');else html=style+html;if(/<\/body>/i.test(html))html=html.replace(/<\/body>/i,scripts+'</body>');else html+=scripts;frame.srcdoc=html;}catch(e){const el=document.getElementById('error');el.hidden=false;el.textContent=String(e);frame.hidden=true;}}
addEventListener('message',async ev=>{if(ev.source!==frame.contentWindow)return;const m=ev.data||{};if(m.type!=='qrx-sdk-request'||!m.id)return;try{const result=await invoke('qrx_app_bridge_call',{appId,method:String(m.method||''),params:m.params||{},network,wallet});frame.contentWindow.postMessage({type:'qrx-sdk-response',id:m.id,ok:true,result},'*');}catch(e){frame.contentWindow.postMessage({type:'qrx-sdk-response',id:m.id,ok:false,error:String(e)},'*');}});
boot();
</script></body></html>
